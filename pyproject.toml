[project]
name = "retirement-planner"
version = "0.1.0"
description = "When can I retire? Deterministic retirement projection in today's EUR."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
